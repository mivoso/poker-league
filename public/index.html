<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tesa Poker League 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#08281f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker League">
<style>
:root{
  --felt:#0d3a2d; --felt-deep:#08281f; --felt-card:#114536;
  --line:rgba(242,235,220,.16); --line-soft:rgba(242,235,220,.08);
  --cream:#f2ebdc; --muted:#9cb9ab; --dim:#6f8f81;
  --gold:#d9a441; --gold-deep:#a87a25;
  --red:#c8412f; --blue:#4a86b8; --green-ok:#5fae7d;
  --rail:#5b3a24;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--felt-deep); color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;}
body{padding-bottom:76px; min-height:100vh;}
.wrap{max-width:560px; margin:0 auto; padding:0 14px;}
header.app{position:sticky; top:0; z-index:20; background:var(--felt-deep);
  border-bottom:3px solid var(--rail); padding:12px 14px 10px;}
header.app .brand{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:700;}
header.app .sub{font-size:13px; color:var(--muted); margin-top:2px;}
h2.sec{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold);
  margin:22px 0 10px; font-weight:700;}
.card{background:var(--felt-card); border:1px solid var(--line-soft); border-radius:14px;
  padding:14px; margin-bottom:12px;}
button{font:inherit; cursor:pointer; border:none;}
.btn{display:block; width:100%; padding:15px; border-radius:12px; font-size:17px; font-weight:700;
  background:var(--gold); color:#2b1f08; margin-top:10px;}
.btn.secondary{background:transparent; border:1px solid var(--line); color:var(--cream); font-weight:600;}
.btn.danger{background:var(--red); color:#fff;}
.btn:disabled{opacity:.4;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--felt-deep); color:var(--cream); font:inherit; margin-top:4px;}
textarea{min-height:64px;}
label.f{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); margin-top:12px;}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
.ptog{padding:13px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--felt-deep); color:var(--cream); font-size:16px; font-weight:600; text-align:center;}
.ptog.on{background:var(--gold); color:#2b1f08; border-color:var(--gold);}
.ptog .g{font-size:11px; color:inherit; opacity:.7; display:block;}
nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
  background:var(--felt-deep); border-top:3px solid var(--rail); padding-bottom:env(safe-area-inset-bottom);}
nav.tabs button{flex:1; padding:12px 4px 10px; background:none; color:var(--dim);
  font-size:12px; font-weight:700; letter-spacing:.04em;}
nav.tabs button .ic{display:block; font-size:20px; margin-bottom:2px;}
nav.tabs button.on{color:var(--gold);}
.prow{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line-soft);}
.prow:last-child{border-bottom:none;}
.prow .nm{flex:1; min-width:0; font-weight:700; font-size:17px;}
.prow .nm .g{font-size:11px; color:var(--muted); font-weight:400;}
.prow .nm .inv{font-size:12px; color:var(--muted); font-weight:400;}
.cnt{display:flex; align-items:center; gap:4px;}
.cnt .lbl{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  width:100%; text-align:center;}
.cbtn{width:44px; height:44px; border-radius:50%; font-size:22px; font-weight:800;
  color:#fff; display:flex; align-items:center; justify-content:center;}
.cbtn.ai{background:var(--red);}
.cbtn.rb{background:var(--blue);}
.cbtn.minus{background:transparent; border:1px solid var(--line); color:var(--muted);
  width:32px; height:32px; font-size:16px;}
.cval{width:26px; text-align:center; font-size:18px; font-weight:800; font-variant-numeric:tabular-nums;}
.cgroup{display:flex; flex-direction:column; align-items:center; gap:2px;}
.cgroup .row{display:flex; align-items:center; gap:4px;}
.statbar{display:flex; gap:8px; margin-bottom:12px;}
.stat{flex:1; background:var(--felt-card); border-radius:12px; padding:10px 8px; text-align:center;}
.stat .v{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
.stat .l{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
table.lb{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
table.lb th{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); font-weight:600;}
table.lb th:nth-child(2){text-align:left;}
table.lb td{padding:9px 4px; border-bottom:1px solid var(--line-soft); text-align:right; font-size:15px;}
table.lb td:nth-child(2){text-align:left; font-weight:700;}
table.lb td.pos{color:var(--muted); width:26px;}
.pos1{color:var(--gold); font-weight:800;}
.neg{color:#e8907f;} .posv{color:#9fd8b4;}
.badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:99px;
  border:1px solid var(--line); color:var(--muted); margin-left:6px; vertical-align:1px;}
.evrow{padding:12px 0; border-bottom:1px solid var(--line-soft);}
.evrow .hd{display:flex; justify-content:space-between; align-items:baseline;}
.evrow .hd .t{font-weight:700;}
.evrow .hd .d{font-size:13px; color:var(--muted);}
.evrow .win{font-size:13px; color:var(--muted); margin-top:2px;}
.toggle-lb{display:flex; gap:8px; margin-bottom:10px;}
.toggle-lb button{flex:1; padding:9px; border-radius:10px; font-size:13px; font-weight:700;
  background:transparent; border:1px solid var(--line); color:var(--muted);}
.toggle-lb button.on{background:var(--gold); color:#2b1f08; border-color:var(--gold);}
.log{font-size:13px; color:var(--muted); padding:4px 0;}
.log b{color:var(--cream);}
.settle-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line-soft);}
.settle-row .nm{flex:1; font-weight:700;}
.settle-row .nm small{display:block; font-size:11px; color:var(--muted); font-weight:400;}
.settle-row input{width:96px; margin:0; text-align:right; font-size:17px; font-weight:700;}
.settle-row .net{width:76px; text-align:right; font-size:14px; font-weight:700;}
.sum-check{margin-top:10px; padding:10px; border-radius:10px; font-size:14px; text-align:center;}
.sum-check.ok{background:rgba(95,174,125,.15); color:var(--green-ok);}
.sum-check.warn{background:rgba(200,65,47,.18); color:#e8907f;}
.copybox{width:100%; min-height:180px; font-family:ui-monospace,Menlo,monospace; font-size:12px;
  white-space:pre; margin-top:8px;}
.xtr{margin-top:8px;}
.xtr summary{font-size:13px; font-weight:700; color:var(--muted); padding:8px 0; cursor:pointer;
  list-style:none;}
.xtr summary::before{content:"▸ ";} .xtr[open] summary::before{content:"▾ ";}
.chiplist{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.chip{font-size:12px; background:var(--felt-deep); border:1px solid var(--line);
  border-radius:99px; padding:4px 10px; color:var(--cream);}
.chip .x{color:var(--red); font-weight:800; margin-left:5px;}
.timer{font-variant-numeric:tabular-nums;}
.hint{font-size:12px; color:var(--dim); margin-top:6px;}
.toast{position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:var(--gold);
  color:#2b1f08; font-weight:700; padding:10px 18px; border-radius:99px; z-index:50; font-size:14px;
  opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.show{opacity:1;}
.famrow{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.famrow .cbtn{width:40px; height:40px; font-size:19px; background:var(--felt-deep);
  border:1px solid var(--line); color:var(--cream);}

/* ---- Bankroll-Verlauf (Chart) ---- */
.bchart{width:100%; height:auto; display:block; margin-top:2px;}
.bchart .grid{stroke:var(--line-soft); stroke-width:1;}
.bchart .zero{stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 3;}
.bchart .axt{fill:var(--dim); font-size:10px; font-variant-numeric:tabular-nums;}
.bchart path.ln{fill:none; stroke-linejoin:round; stroke-linecap:round;}
.blegend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.bchip{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--felt-deep);
  border:1px solid var(--line); border-radius:99px; padding:4px 9px; color:var(--cream);
  cursor:pointer; opacity:.6; font-variant-numeric:tabular-nums;}
.bchip.on{opacity:1; border-color:var(--gold);}
.bchip .sw{width:10px; height:10px; border-radius:50%; flex:none;}

/* ---- Beamer / TV Live-Modus ---- */
#tv-root{display:none;}
body.tv-on{overflow:hidden;}
body.tv-on header.app, body.tv-on nav.tabs, body.tv-on .wrap{display:none !important;}
body.tv-on #tv-root{display:block; position:fixed; inset:0; z-index:100;
  background:radial-gradient(130% 110% at 50% 0%, var(--felt) 0%, var(--felt-deep) 68%);
  padding:2.2vh 2.4vw;}
.tv-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2vh;}
.tv-brand{font-size:2.1vh; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:800;}
.tv-sub{font-size:1.3vh; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:.3vh;}
.tv-right{display:flex; align-items:center; gap:1.6vw;}
.tv-clock{font-size:3vh; font-weight:800; font-variant-numeric:tabular-nums; color:var(--cream);}
.tv-exit{font-size:1.5vh; color:var(--muted); border:1px solid var(--line); background:transparent;
  border-radius:8px; padding:.8vh 1vw; cursor:pointer;}
.tv-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:2vw; height:88vh;}
.tv-col{min-height:0;}
.tv-panel{background:var(--felt-card); border:1px solid var(--line-soft); border-radius:14px;
  padding:2vh 1.6vw; height:100%; overflow:hidden; display:flex; flex-direction:column;}
.tv-h{font-size:1.7vh; letter-spacing:.16em; text-transform:uppercase; color:var(--gold);
  font-weight:800; margin-bottom:1.6vh; flex:none;}
.tv-stats{display:flex; gap:1vw; margin-bottom:1.8vh; flex:none;}
.tv-stat{flex:1; background:var(--felt-deep); border-radius:10px; padding:1.2vh .6vw; text-align:center;}
.tv-stat .v{font-size:3.2vh; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.tv-stat .l{font-size:1.15vh; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:.4vh;}
.tv-list{flex:1; min-height:0; overflow:hidden;}
.tv-row{display:flex; align-items:center; gap:1vw; padding:1.05vh 0;
  border-bottom:1px solid var(--line-soft); font-size:2.4vh;}
.tv-row .r{width:3.2vh; color:var(--muted); font-weight:800; text-align:center; font-variant-numeric:tabular-nums;}
.tv-row .r.r1{color:var(--gold);}
.tv-row .nm{flex:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tv-row .val{font-variant-numeric:tabular-nums; font-weight:800;}
.tv-row .sub{font-size:1.4vh; color:var(--muted); font-weight:600;}
</style>
</head>

let S={players:REGULARS.slice(),events:seedEvents(),active:null};
let tab='game', lbMode='score', settling=false, timerIv=null;
let bankSel=null, tvMode=false, tvClockIv=null;
const PAL=['#e6b422','#4fb0e0','#ef6f6c','#7ed492','#c89be8','#f2a65a','#63d3c9','#f28ec0','#b7d24a','#9aa8ff','#e8d07a','#cf8bf3','#8fd0f0'];
const colorFor=n=>PAL[((S.players.indexOf(n))%PAL.length+PAL.length)%PAL.length];

const hasWS=typeof window.storage!=='undefined'&&window.storage;
async function load(){
  let raw=null;
  if(hasWS){try{const r=await window.storage.get(KEY); if(r&&r.value)raw=r.value;}catch(e){}}
  if(!raw){try{raw=localStorage.getItem(KEY);}catch(e){}}
  if(raw){try{S=JSON.parse(raw);}catch(e){}}
  render();
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const j=JSON.stringify(S); let ok=false;
    if(hasWS){try{await window.storage.set(KEY,j);ok=true;}catch(e){}}
    try{localStorage.setItem(KEY,j);ok=true;}catch(e){}
    if(!ok)toast('Speichern fehlgeschlagen – Backup sichern!');
    cloudPush();
  },300);
}
function importBackup(){
  const v=document.getElementById('imp-in').value.trim(); if(!v){toast('Nichts eingefügt');return;}
  try{const o=JSON.parse(v); if(!o.events||!o.players)throw 0;
    S=o;save();render();toast('Backup geladen ✓');}
  catch(e){toast('Ungültiges Backup');}
}

const nowT=()=>new Date().toTimeString().slice(0,5);
const todayD=()=>new Date().toISOString().slice(0,10);
const dDate=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return dd+'.'+m+'.'+y;};

function scoreFor(rank,n){
  if(rank===1)return 15; if(rank===2)return 10; if(rank===3)return 8;
  if(rank===4)return n>=8?6:0; if(rank===5)return n>=9?4:0; if(rank===6)return n>=10?2:0;
  return 0;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);}

function setTab(t){tab=t; settling=false; render();}

function render(){
  document.getElementById('tab-game').classList.toggle('on',tab==='game');
  document.getElementById('tab-lb').classList.toggle('on',tab==='lb');
  document.getElementById('tab-hist').classList.toggle('on',tab==='hist');
  const done=S.events.filter(e=>e.finished).length;
  document.getElementById('hdrsub').textContent=done+' Events gespielt · Saison 2026';
  const app=document.getElementById('app');
  clearInterval(timerIv);
  if(tab==='game') app.innerHTML=S.active?(settling?settleView():liveView()):setupView();
  else if(tab==='lb') app.innerHTML=lbView();
  else app.innerHTML=histView();
  if(tab==='game'&&S.active&&!settling){
    timerIv=setInterval(()=>{const el=document.getElementById('elapsed'); if(el)el.textContent=elapsed();},30000);
  }
  if(tvMode)renderTV();
}

/* ---------- SETUP ---------- */
let sel=new Set(), guestList=[];
function setupView(){
  const nr=S.events.length+1;
  return `<h2 class="sec">Neuer Spieltag · Event ${nr}</h2>
  <div class="card">
    <label class="f">Datum</label><input type="date" id="ev-date" value="${todayD()}">
    <label class="f">Location</label>
    <select id="ev-loc" onchange="document.getElementById('ev-loc-new').style.display=this.value==='__new'?'block':'none'">${LOCATIONS.map(l=>`<option>${esc(l)}</option>`).join('')}<option value="__new">Neue Location…</option></select>
    <input type="text" id="ev-loc-new" placeholder="Name der Location" style="display:none">
    <label class="f">Startzeit</label><input type="time" id="ev-start" value="${nowT()}">
  </div>
  <h2 class="sec">Wer spielt mit?</h2>
  <div class="card">
    <div class="pgrid">${S.players.map(p=>`<button class="ptog ${sel.has(p)?'on':''}" onclick="togP('${esc(p)}')">${esc(p)}</button>`).join('')}
    ${guestList.map(g=>`<button class="ptog on" onclick="togG('${esc(g)}')">${esc(g)}<span class="g">Gast · tippen zum Entfernen</span></button>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="guest-name" placeholder="Gast hinzufügen" style="margin:0">
      <button class="btn secondary" style="width:auto;margin:0;padding:11px 16px" onclick="addGuest()">+</button>
    </div>
    <div class="hint" id="selcount">${selCount()} Spieler ausgewählt (mind. 6 für Wertung)</div>
  </div>
  <button class="btn" onclick="startEvent()">Session starten ▶</button>`;
}
function selCount(){return sel.size+guestList.length;}
function togP(p){sel.has(p)?sel.delete(p):sel.add(p);render();}
function togG(g){guestList=guestList.filter(x=>x!==g);render();}
function addGuest(){const i=document.getElementById('guest-name');const v=i.value.trim();
  if(v&&!guestList.includes(v)&&!S.players.includes(v)){guestList.push(v);render();}}
function startEvent(){
  if(selCount()<2){toast('Spieler auswählen');return;}
  let loc=document.getElementById('ev-loc').value;
  if(loc==='__new')loc=document.getElementById('ev-loc-new').value.trim()||'Unbekannt';
  S.active={id:Date.now(),nr:S.events.length+1,loc,
    date:document.getElementById('ev-date').value||todayD(),
    start:document.getElementById('ev-start').value||nowT(),end:'',finished:false,
    parts:[...sel].map(n=>({n,g:false,ai:0,rb:0,gross:null,net:0,rank:0,score:0}))
      .concat(guestList.map(n=>({n,g:true,ai:0,rb:0,gross:null,net:0,rank:0,score:0}))),
    firstAI:null,firstRB:null,fam:0,quotes:[],quads:[],bounty:[],
    sf:"",rf:"",dealer:"",actor:"",pot:"",wb:"",bb:"",rounds:"",games:""};
  sel=new Set();guestList=[];save();render();
}

/* ---------- LIVE ---------- */
function elapsed(){
  if(!S.active||!S.active.start)return'';
  const[h,m]=S.active.start.split(':').map(Number);
  const st=new Date();st.setHours(h,m,0,0);
  let diff=Date.now()-st.getTime(); if(diff<0)diff+=86400000;
  const hh=Math.floor(diff/3600000),mm=Math.floor(diff%3600000/60000);
  return hh+':'+String(mm).padStart(2,'0')+' h';
}
function liveView(){

  const pot=ev.parts.reduce((s,p)=>s+BUYIN+p.rb*BUYIN,0);
  return `<h2 class="sec">Event ${ev.nr} · ${esc(ev.loc)} · ${dDate(ev.date)}</h2>

    <div class="stat"><div class="v timer" id="elapsed">${elapsed()}</div><div class="l">seit ${ev.start}</div></div>
    <div class="stat"><div class="v">${ev.parts.length}</div><div class="l">Spieler</div></div>
    <div class="stat"><div class="v">${tAI} / ${tRB}</div><div class="l">All-ins / Rebuys</div></div>
    <div class="stat"><div class="v">${Math.round(pot)} €</div><div class="l">Pot</div></div>
  </div>
  <div class="card">
    ${ev.parts.map((p,i)=>`<div class="prow">
      <div class="nm">${esc(p.n)}${p.g?' <span class="g">Gast</span>':''}<br><span class="inv">Einsatz ${fmt(BUYIN+p.rb*BUYIN)}</span></div>
      <div class="cgroup"><div class="lbl">All-in</div><div class="row">
        <button class="cbtn minus" onclick="dec(${i},'ai')">−</button>
        <span class="cval">${p.ai}</span>
        <button class="cbtn ai" onclick="inc(${i},'ai')">+</button></div></div>
      <div class="cgroup"><div class="lbl">Rebuy</div><div class="row">
        <button class="cbtn minus" onclick="dec(${i},'rb')">−</button>
        <span class="cval">${p.rb}</span>
        <button class="cbtn rb" onclick="inc(${i},'rb')">+</button></div></div>
    </div>`).join('')}
  </div>
  ${ev.firstAI?`<div class="log">⚡ Erster All-in: <b>${esc(ev.firstAI.p)}</b> um ${ev.firstAI.t}</div>`:''}
  ${ev.firstRB?`<div class="log">💸 Erster Rebuy: <b>${esc(ev.firstRB.p)}</b> um ${ev.firstRB.t}</div>`:''}

  <h2 class="sec">Event-Extras</h2>
  <div class="card">
    <div class="famrow"><span>👨‍👩‍👧 Familienrunden</span>
      <span style="display:flex;align-items:center;gap:8px">
        <button class="cbtn minus" onclick="fam(-1)">−</button>
        <span class="cval" style="width:auto">${ev.fam}</span>
        <button class="cbtn" style="background:var(--gold);color:#2b1f08" onclick="fam(1)">+</button></span>
    </div>
    <details class="xtr"><summary>💬 Quotes (${ev.quotes.length})</summary>
      <div style="display:flex;gap:8px"><input type="text" id="q-in" placeholder="Zitat + Urheber" style="margin:0">
      <button class="btn secondary" style="width:auto;margin:0;padding:11px 14px" onclick="addQ()">+</button></div>
      <div class="chiplist">${ev.quotes.map((q,i)=>`<span class="chip">${esc(q)}<span class="x" onclick="delQ(${i})">✕</span></span>`).join('')}</div>
    </details>
    <details class="xtr"><summary>🃏 Quads (${ev.quads.length})</summary>
      <div style="display:flex;gap:8px"><input type="text" id="qd-in" placeholder="z. B. 7er – Bernd" style="margin:0">
      <button class="btn secondary" style="width:auto;margin:0;padding:11px 14px" onclick="addQd()">+</button></div>
      <div class="chiplist">${ev.quads.map((q,i)=>`<span class="chip">${esc(q)}<span class="x" onclick="delQd(${i})">✕</span></span>`).join('')}</div>
    </details>
    <details class="xtr"><summary>🎯 7-4 Bounty (${ev.bounty.length})</summary>
      <select id="b-in" style="margin-top:0">${ev.parts.map(p=>`<option>${esc(p.n)}</option>`).join('')}</select>
      <button class="btn secondary" onclick="addB()">Bounty erfassen (alle zahlen 1 BB)</button>
      <div class="chiplist">${ev.bounty.map((b,i)=>`<span class="chip">${esc(b)}<span class="x" onclick="delB(${i})">✕</span></span>`).join('')}</div>
    </details>

      <label class="f">Best Dealer</label><input type="text" value="${esc(ev.dealer)}" onchange="fld('dealer',this.value)">
      <label class="f">Best Actor</label><input type="text" value="${esc(ev.actor)}" onchange="fld('actor',this.value)">

      <label class="f">Best Board</label><input type="text" value="${esc(ev.bb)}" onchange="fld('bb',this.value)">
      <label class="f">Runden gespielt</label><input type="number" value="${esc(ev.rounds)}" onchange="fld('rounds',this.value)">

  <button class="btn" onclick="startSettle()">Session beenden → Abrechnung 🏁</button>

  <button class="btn secondary" id="abort-btn" onclick="abortEvent(this)">Spieltag verwerfen</button>`;

function inc(i,k){const ev=S.active,p=ev.parts[i];p[k]++;
  const now=nowT();
  if(k==='ai'&&!ev.firstAI)ev.firstAI={t:now,p:p.n};
  if(k==='rb'&&!ev.firstRB)ev.firstRB={t:now,p:p.n};
  save();render();}
function dec(i,k){const p=S.active.parts[i];if(p[k]>0)p[k]--;save();render();}
function fam(d){S.active.fam=Math.max(0,S.active.fam+d);save();render();}
function addQ(){const v=document.getElementById('q-in').value.trim();if(v){S.active.quotes.push(v);save();render();}}
function delQ(i){S.active.quotes.splice(i,1);save();render();}
function addQd(){const v=document.getElementById('qd-in').value.trim();if(v){S.active.quads.push(v);save();render();}}
function delQd(i){S.active.quads.splice(i,1);save();render();}
function addB(){const v=document.getElementById('b-in').value;S.active.bounty.push(v+' ('+nowT()+')');save();render();}
function delB(i){S.active.bounty.splice(i,1);save();render();}
function fld(k,v){S.active[k]=v;save();}
let abortArmed=false;
function abortEvent(btn){
  if(!abortArmed){abortArmed=true;btn.textContent='Wirklich verwerfen? Nochmal tippen';btn.classList.add('danger');
    setTimeout(()=>{abortArmed=false;const b=document.getElementById('abort-btn');
      if(b){b.textContent='Spieltag verwerfen';b.classList.remove('danger');}},3000);
    return;}
  abortArmed=false;S.active=null;save();render();
}

/* ---------- SETTLE ---------- */
function startSettle(){if(!S.active.end)S.active.end=nowT();settling=true;save();render();}
function settleView(){
  const ev=S.active;
  const pot=ev.parts.reduce((s,p)=>s+BUYIN+p.rb*BUYIN,0);
  const entered=ev.parts.reduce((s,p)=>s+(p.gross??0),0);
  const diff=Math.round((entered-pot)*100)/100;
  const allSet=ev.parts.every(p=>p.gross!==null&&p.gross!=='');
  return `<h2 class="sec">Abrechnung · Event ${ev.nr}</h2>
  <div class="card">
    <label class="f">Ende</label><input type="time" value="${ev.end}" onchange="fld('end',this.value)">
    <div class="hint">Endstack (Chips in €) pro Spieler eintragen. Netto = Endstack − Einsatz.</div>
    ${ev.parts.map((p,i)=>{
      const inv=BUYIN+p.rb*BUYIN;
      const net=p.gross===null?null:Math.round((p.gross-inv)*100)/100;
      return `<div class="settle-row">
        <div class="nm">${esc(p.n)}${p.g?' <small>Gast</small>':''}<small>Einsatz ${fmt(inv)}</small></div>
        <input type="number" step="0.05" inputmode="decimal" placeholder="0,00"
          value="${p.gross===null?'':p.gross}" onchange="setGross(${i},this.value)">
        <div class="net ${net===null?'':net<0?'neg':'posv'}">${net===null?'–':fmtS(net)}</div>
      </div>`;}).join('')}
    <div class="sum-check ${Math.abs(diff)<0.05?'ok':'warn'}">
      Pot ${fmt(pot)} · erfasst ${fmt(entered)} ${Math.abs(diff)<0.05?'✓ passt':'· Differenz '+fmtS(diff)}
    </div>
  </div>
  <button class="btn" ${allSet?'':'disabled'} onclick="finishEvent()">Spieltag abschließen ✔</button>
  <button class="btn secondary" onclick="settling=false;render()">← Zurück zum Live-Tracking</button>`;
}
function setGross(i,v){
  const p=S.active.parts[i];
  p.gross=v===''?null:Math.round(parseFloat(String(v).replace(',','.'))*100)/100;
  if(isNaN(p.gross))p.gross=null;
  save();render();
}
function computeResults(ev){
  const n=ev.parts.length;
  ev.parts.forEach(p=>{p.net=Math.round(((p.gross||0)-(BUYIN+p.rb*BUYIN))*100)/100;});
  const sorted=[...ev.parts].sort((a,b)=>b.net-a.net);
  let rank=0,prev=null;
  sorted.forEach((p,i)=>{if(prev===null||p.net<prev){rank=i+1;prev=p.net;}p.rank=rank;p.score=scoreFor(rank,n);});
}
function finishEvent(){
  const ev=S.active;
  computeResults(ev);
  ev.finished=true;
  S.events.push(ev);
  S.active=null;settling=false;save();
  tab='hist';render();
  toast('Event '+ev.nr+' gespeichert 🏆');
}

/* ---------- LEADERBOARD ---------- */
function seasonTotals(){
  const map={};
  S.players.forEach(p=>map[p]={n:p,bank:0,score:0,wins:0,ev:0,ai:0,rb:0});
  S.events.filter(e=>e.finished).forEach(e=>e.parts.forEach(p=>{
    if(p.g)return; const t=map[p.n]; if(!t)return;
    t.bank=Math.round((t.bank+(p.net||0))*100)/100;
    t.score+=p.score||0; t.ev++; t.ai+=p.ai||0; t.rb+=p.rb||0;
    if(p.rank===1)t.wins++;
  }));
  return Object.values(map).filter(t=>t.ev>0);
}
function lbView(){
  const rows=seasonTotals().sort((a,b)=>b.bank-a.bank||b.score-a.score);
  const evCount=S.events.filter(e=>e.finished).length;
  return `<h2 class="sec">Saison-Leaderboard · YTD · nach Bankroll</h2>
  <div class="card" style="padding:8px 12px">
    <table class="lb"><tr><th></th><th>Spieler</th><th>€</th><th>Pkt</th><th>W</th><th>Ev</th><th>AI</th><th>RB</th></tr>
    ${rows.map((r,i)=>{
      const qual=r.ev>=5;
      return `<tr><td class="pos ${i===0?'pos1':''}">${i+1}</td>
      <td>${esc(r.n)}${qual?'':'<span class="badge">'+r.ev+'/5</span>'}</td>
      <td><span class="${r.bank<0?'neg':'posv'}">${fmt(r.bank)}</span></td><td>${r.score}</td><td>${r.wins}</td><td>${r.ev}</td><td>${r.ai}</td><td>${r.rb}</td></tr>`;
    }).join('')}</table>
  </div>
  <div class="hint">W = Tagessiege · AI/RB = All-ins/Rebuys · Badge = noch nicht qualifiziert (5+ Events nötig) · ${evCount} Events gewertet</div>
  <h2 class="sec">Bankroll-Verlauf</h2>
  <div class="card">${bankChart()}</div>
  <button class="btn secondary" onclick="enterTV()">📺 Beamer-Modus (Live-Stand)</button>
  <button class="btn secondary" onclick="copyText(lbWhatsApp())">📤 Leaderboard für WhatsApp kopieren</button>`;
}

/* ---------- BANKROLL-VERLAUF ---------- */
function bankChart(){
  const evs=S.events.filter(e=>e.finished).sort((a,b)=>a.nr-b.nr);
  if(!evs.length)return '<div class="hint">Noch keine gewerteten Events.</div>';
  const names=seasonTotals().map(t=>t.n);
  if(!names.length)return '<div class="hint">Noch keine Wertung.</div>';
  const series=names.map(n=>{
    let c=0; const pts=[0];
    evs.forEach(e=>{const p=e.parts.find(x=>x.n===n&&!x.g); c=Math.round((c+(p?p.net:0))*100)/100; pts.push(c);});
    return {n,pts,end:pts[pts.length-1]};
  });
  const allv=series.flatMap(s=>s.pts).concat(0);
  let mn=Math.min(...allv), mx=Math.max(...allv);
  if(mn===mx){mn-=10;mx+=10;}
  const pd=(mx-mn)*0.08||10; mn-=pd; mx+=pd;
  const W=520,H=260,L=36,R=14,T=12,B=22, iw=W-L-R, ih=H-T-B, N=evs.length;
  const X=i=>L+(N?iw*i/N:0), Y=v=>T+ih*(1-(v-mn)/(mx-mn));
  let grid='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4, yy=Y(v);
    grid+=`<line class="grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`+
      `<text class="axt" x="${L-5}" y="${(yy+3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;}
  let xl='';
  for(let i=0;i<=N;i++){ if(N>8&&i%2===1&&i!==N)continue;
    xl+=`<text class="axt" x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="middle">${i?('E'+evs[i-1].nr):'Start'}</text>`;}
  const zero=`<line class="zero" x1="${L}" y1="${Y(0).toFixed(1)}" x2="${W-R}" y2="${Y(0).toFixed(1)}"/>`;
  const lines=series.map(s=>{
    const d=s.pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const col=colorFor(s.n);
    const op=bankSel?(bankSel===s.n?1:0.1):0.82, w=bankSel===s.n?3.4:2;
    let lab='';
    if(bankSel===s.n)lab=`<circle cx="${X(N).toFixed(1)}" cy="${Y(s.end).toFixed(1)}" r="3.6" fill="${col}"/>`+
      `<text class="axt" x="${(X(N)-7).toFixed(1)}" y="${(Y(s.end)-7).toFixed(1)}" text-anchor="end" style="fill:${col};font-weight:800;font-size:12px">${esc(s.n)} ${fmtS(s.end)}</text>`;
    return `<path class="ln" d="${d}" stroke="${col}" stroke-width="${w}" style="opacity:${op}"/>${lab}`;
  }).join('');
  const legend=series.slice().sort((a,b)=>b.end-a.end).map(s=>
    `<span class="bchip ${bankSel===s.n?'on':''}" onclick="bankSel=bankSel==='${esc(s.n)}'?null:'${esc(s.n)}';render()">`+
    `<span class="sw" style="background:${colorFor(s.n)}"></span>${esc(s.n)} <b>${fmtS(s.end)}</b></span>`).join('');
  return `<svg class="bchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${zero}${lines}${xl}</svg>`+
    `<div class="blegend">${legend}</div>`+
    `<div class="hint">Kumulierte Bankroll (€) über die Saison · Spieler antippen zum Hervorheben</div>`;
}

/* ---------- BEAMER / TV LIVE-MODUS ---------- */
function enterTV(){tvMode=true;document.body.classList.add('tv-on');renderTV();
  const el=document.documentElement; if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}
function exitTV(){tvMode=false;clearInterval(tvClockIv);document.body.classList.remove('tv-on');
  const r=document.getElementById('tv-root'); if(r)r.innerHTML='';
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}
function tvTick(){const c=document.getElementById('tv-clock'); if(c)c.textContent=nowT();
  const e=document.getElementById('tv-elapsed'); if(e)e.textContent=elapsed();}
function renderTV(){
  const root=document.getElementById('tv-root'); if(!root)return;
  const ev=S.active;
  const season=seasonTotals().sort((a,b)=>b.bank-a.bank||b.score-a.score);
  const seasonRows=season.slice(0,13).map((r,i)=>
    `<div class="tv-row"><span class="r ${i===0?'r1':''}">${i+1}</span>`+
    `<span class="nm">${esc(r.n)}</span>`+
    `<span class="val" style="width:5vw;text-align:right"><span class="sub">${r.score} Pkt</span></span>`+
    `<span class="val ${r.bank<0?'neg':'posv'}" style="width:7vw;text-align:right">${fmt(r.bank)}</span></div>`).join('');
  const seasonPanel=`<div class="tv-panel"><div class="tv-h">Saison · YTD · nach Bankroll · ${S.events.filter(e=>e.finished).length} Events</div>`+
    `<div class="tv-list">${seasonRows||'<div class="hint">Noch keine Wertung.</div>'}</div></div>`;
  let today;
  if(ev){
    const pot=ev.parts.reduce((s,p)=>s+BUYIN+p.rb*BUYIN,0);
    const tAI=ev.parts.reduce((s,p)=>s+p.ai,0), tRB=ev.parts.reduce((s,p)=>s+p.rb,0);
    let rows;
    if(settling){
      const sorted=ev.parts.map(p=>({n:p.n,g:p.g,net:p.gross===null?null:Math.round((p.gross-(BUYIN+p.rb*BUYIN))*100)/100}))
        .sort((a,b)=>(b.net===null?-1e9:b.net)-(a.net===null?-1e9:a.net));
      rows=sorted.map((p,i)=>`<div class="tv-row"><span class="r ${i===0&&p.net!==null?'r1':''}">${p.net===null?'·':i+1}</span>`+
        `<span class="nm">${esc(p.n)}${p.g?' <span class="sub">Gast</span>':''}</span>`+
        `<span class="val ${p.net===null?'':p.net<0?'neg':'posv'}">${p.net===null?'–':fmtS(p.net)}</span></div>`).join('');
    } else {
      rows=ev.parts.map(p=>`<div class="tv-row"><span class="r">•</span>`+
        `<span class="nm">${esc(p.n)}${p.g?' <span class="sub">Gast</span>':''}</span>`+
        `<span class="val"><span class="sub">Einsatz </span>${fmt(BUYIN+p.rb*BUYIN)}</span>`+
        `<span class="val" style="width:6vw;text-align:right">${p.ai}/${p.rb}<span class="sub"> AI/RB</span></span></div>`).join('');
    }
    today=`<div class="tv-panel"><div class="tv-h">Heute · Event ${ev.nr} · ${esc(ev.loc)}${settling?' · Abrechnung':''}</div>`+
      `<div class="tv-stats">`+
        `<div class="tv-stat"><div class="v" id="tv-elapsed">${elapsed()||'–'}</div><div class="l">seit ${ev.start}</div></div>`+
        `<div class="tv-stat"><div class="v">${ev.parts.length}</div><div class="l">Spieler</div></div>`+
        `<div class="tv-stat"><div class="v">${Math.round(pot)} €</div><div class="l">Pot</div></div>`+
        `<div class="tv-stat"><div class="v">${tAI}/${tRB}</div><div class="l">All-ins/Rebuys</div></div>`+
      `</div><div class="tv-list">${rows}</div>`+
      (ev.firstAI?`<div class="hint" style="font-size:1.4vh;margin-top:1vh;flex:none">⚡ Erster All-in: ${esc(ev.firstAI.p)} · ${ev.firstAI.t}${ev.firstRB?`   💸 Erster Rebuy: ${esc(ev.firstRB.p)} · ${ev.firstRB.t}`:''}</div>`:'')+
      `</div>`;
  } else {
    const last=[...S.events].filter(e=>e.finished).sort((a,b)=>b.nr-a.nr)[0];
    const win=last?[...last.parts].sort((a,b)=>b.net-a.net)[0]:null;
    today=`<div class="tv-panel" style="justify-content:center;align-items:center;text-align:center">`+
      `<div class="tv-h">Kein aktiver Spieltag</div>`+
      (last?`<div style="font-size:1.8vh;color:var(--muted)">Letzter Spieltag · Event ${last.nr} · ${esc(last.loc)}</div>`+
        `<div style="font-size:4vh;font-weight:800;margin-top:1.4vh">🏆 ${esc(win.n)}</div>`+
        `<div class="posv" style="font-size:2.4vh;font-weight:800">${fmtS(win.net)}</div>`
        :`<div class="hint">Starte einen Spieltag im Reiter „Spieltag".</div>`)+`</div>`;
  }
  root.innerHTML=`<div class="tv-head">`+
    `<div><div class="tv-brand">♠ tesa Poker League 2026</div><div class="tv-sub">${ev?'Live-Stand':'Saison-Übersicht'}</div></div>`+
    `<div class="tv-right"><div class="tv-clock" id="tv-clock">${nowT()}</div>`+
    `<button class="tv-exit" onclick="exitTV()">✕ Beenden</button></div></div>`+
    `<div class="tv-grid"><div class="tv-col">${today}</div><div class="tv-col">${seasonPanel}</div></div>`;
  clearInterval(tvClockIv); tvClockIv=setInterval(tvTick,5000);
}

/* ---------- HISTORY ---------- */
let openEv=null;
function histView(){
  const evs=[...S.events].filter(e=>e.finished).sort((a,b)=>b.nr-a.nr);
  return `<h2 class="sec">Spieltage</h2>
  <div class="card">
  ${evs.length?evs.map(e=>{
    const win=[...e.parts].sort((a,b)=>b.net-a.net)[0];
    const open=openEv===e.id;
    return `<div class="evrow">
      <div class="hd" onclick="openEv=${open?'null':e.id};render()" style="cursor:pointer">
        <span class="t">Event ${e.nr} · ${esc(e.loc)}</span><span class="d">${dDate(e.date)} ${open?'▾':'▸'}</span>
      </div>
      <div class="win">🏆 ${esc(win?win.n:'–')} ${win?fmtS(win.net):''}</div>
      ${open?evDetail(e):''}
    </div>`;
  }).join(''):'<div class="hint">Noch keine Events.</div>'}
  </div>
  <h2 class="sec">Daten</h2>
  <button class="btn secondary" onclick="showBackup()">🔐 Backup anzeigen (JSON)</button>
  <div id="backup-area"></div>`;
}
function evDetail(e){
  const sorted=[...e.parts].sort((a,b)=>(a.rank||99)-(b.rank||99));
  return `<table class="lb" style="margin-top:8px">
    <tr><th></th><th>Spieler</th><th>Netto</th><th>Pkt</th><th>AI</th><th>RB</th></tr>
    ${sorted.map(p=>`<tr><td class="pos">${p.rank||'–'}</td><td>${esc(p.n)}${p.g?' <span class="badge">Gast</span>':''}</td>
      <td><span class="${p.net<0?'neg':'posv'}">${fmtS(p.net)}</span></td><td>${p.score||0}</td><td>${p.ai}</td><td>${p.rb}</td></tr>`).join('')}
  </table>
  <div class="log" style="margin-top:6px">
    ${e.start?'⏱ '+e.start+(e.end?'–'+e.end:''):''} ${e.fam?' · 👨‍👩‍👧 '+e.fam+' Familienrunden':''}
    ${e.firstAI?' · ⚡ '+esc(e.firstAI.p)+' ('+e.firstAI.t+')':''}
    ${e.quads.length?' · 🃏 '+esc(e.quads.join(', ')):''}
    ${e.bounty.length?' · 🎯 '+esc(e.bounty.join(', ')):''}
  </div>
  ${e.quotes.length?`<div class="log">💬 ${e.quotes.map(esc).join(' · ')}</div>`:''}
  <button class="btn secondary" onclick="copyText(evWhatsApp(${e.id}))">📤 WhatsApp-Bericht kopieren</button>`;
}
function showBackup(){
  document.getElementById('backup-area').innerHTML=
    `<textarea class="copybox" readonly>${esc(JSON.stringify(S,null,1))}</textarea>
     <button class="btn secondary" onclick="copyText(JSON.stringify(S))">Backup kopieren</button>
     <div class="hint">Dieses JSON bei Claude einfügen, um die Excel zu aktualisieren. Zur Sicherheit einmal an dich selbst per WhatsApp schicken.</div>
     <h2 class="sec">Backup einspielen</h2>
     <textarea id="imp-in" placeholder="JSON hier einfügen" style="min-height:70px"></textarea>
     <button class="btn secondary" onclick="importBackup()">Backup wiederherstellen</button>
     <div class="hint">Überschreibt alle Daten in dieser App.</div>`;
}

/* ---------- EXPORT ---------- */
function evWhatsApp(id){
  const e=S.events.find(x=>x.id===id); if(!e)return'';
  const sorted=[...e.parts].sort((a,b)=>(a.rank||99)-(b.rank||99));
  const tAI=e.parts.reduce((s,p)=>s+p.ai,0),tRB=e.parts.reduce((s,p)=>s+p.rb,0);
  let t=`🃏 *tesa Poker League – Event ${e.nr}*\n📍 ${e.loc}, ${dDate(e.date)}\n`;
  if(e.start)t+=`⏱ ${e.start}${e.end?'–'+e.end:''} Uhr\n`;
  t+=`👥 ${e.parts.length} Spieler\n\n🏆 *Ergebnis:*\n`;
  sorted.forEach(p=>{t+=`${p.rank}. ${p.n}${p.g?' (Gast)':''}  ${fmtS(p.net)}${p.score?'  ·  '+p.score+' Pkt':''}\n`;});
  t+=`\n🎲 All-ins: ${tAI} · Rebuys: ${tRB}\n`;
  if(e.firstAI)t+=`⚡ Erster All-in: ${e.firstAI.p} (${e.firstAI.t})\n`;
  if(e.firstRB)t+=`💸 Erster Rebuy: ${e.firstRB.p} (${e.firstRB.t})\n`;
  if(e.fam)t+=`👨‍👩‍👧 Familienrunden: ${e.fam}\n`;
  if(e.quads.length)t+=`🃏 Quads: ${e.quads.join(', ')}\n`;
  if(e.bounty.length)t+=`🎯 7-4 Bounty: ${e.bounty.join(', ')}\n`;
  if(e.sf)t+=`✨ Straight Flush: ${e.sf}\n`;
  if(e.rf)t+=`👑 Royal Flush: ${e.rf}\n`;
  if(e.pot)t+=`💰 Größter Pot: ${e.pot}\n`;
  if(e.quotes.length)t+=`\n💬 _${e.quotes.join('_\n💬 _')}_\n`;
  t+='\n'+lbWhatsApp(3);
  return t;
}
function lbWhatsApp(top){
  const rows=seasonTotals().sort((a,b)=>b.bank-a.bank||b.score-a.score);
  const list=top?rows.slice(0,top):rows;
  let t=`📊 *Saison ${top?'Top '+top:'Leaderboard'} (Bankroll):*\n`;
  list.forEach((r,i)=>{t+=`${i+1}. ${r.n} – ${fmt(r.bank)} · ${r.score} Pkt${r.ev<5?' *':''}\n`;});
  if(!top)t+='\n* = noch keine 5 Events';
  return t;
}
function copyText(txt){
  navigator.clipboard.writeText(txt).then(()=>toast('Kopiert ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast('Kopiert ✓');});
}

/* ---------- CLOUD SYNC (Firebase Firestore) ---------- */
const cloud={ref:null,ready:false,ts:0,applying:false,
  id:Math.random().toString(36).slice(2)+Date.now().toString(36)};

function cloudDot(state){
  const d=document.getElementById('cloud-dot'); if(!d)return;
  const map={off:['☁','.35','Nur lokal (keine Cloud)'],
    connecting:['☁','.6','Cloud verbindet …'],
    ok:['☁︎','1','Cloud synchronisiert'],
    err:['⚠','1','Cloud-Fehler – nur lokal gespeichert']};
  const m=map[state]||map.off; d.textContent=m[0]; d.style.opacity=m[1];
  d.style.color=state==='err'?'var(--red)':state==='ok'?'var(--green-ok)':'';
  d.title=m[2];
}

function cloudInit(){
  if(typeof firebase==='undefined'||!firebaseConfig.apiKey){cloudDot('off');return;}
  cloudDot('connecting');
  try{
    firebase.initializeApp(firebaseConfig);
    const ref=firebase.firestore().collection('leagues').doc(LEAGUE_ID);
    cloud.ref=ref;
    firebase.auth().signInAnonymously().catch(e=>{console.warn('Cloud-Auth',e);cloudDot('err');});
    firebase.auth().onAuthStateChanged(u=>{ if(u&&!cloud.ready){cloud.ready=true; cloudListen();} });
  }catch(e){console.warn('Cloud-Init',e);cloudDot('err');}
}

function cloudListen(){
  cloud.ref.onSnapshot(snap=>{
    if(!snap.exists){ cloudDot('ok'); cloudPush(true); return; }   // Cloud leer → aktuellen Stand hochladen
    const d=snap.data();
    if(!d||typeof d.ts!=='number'||typeof d.blob!=='string'){cloudDot('ok');return;}
    if(d.origin===cloud.id){cloud.ts=Math.max(cloud.ts,d.ts);cloudDot('ok');return;} // eigenes Echo
    if(d.ts<=cloud.ts){cloudDot('ok');return;}                     // nicht neuer → ignorieren
    try{
      const inc=JSON.parse(d.blob);
      if(!inc||!inc.events||!inc.players){cloudDot('ok');return;}
      cloud.ts=d.ts; cloud.applying=true;
      S=inc;
      try{localStorage.setItem(KEY,d.blob);}catch(e){}
      render(); cloud.applying=false; cloudDot('ok');
    }catch(e){cloud.applying=false;cloudDot('ok');}
  },err=>{console.warn('Cloud-Listen',err);cloudDot('err');});
}

let cloudPushT=null;
function cloudPush(seed){
  if(!cloud.ready||!cloud.ref||cloud.applying)return;
  clearTimeout(cloudPushT);
  cloudPushT=setTimeout(()=>{
    const ts=Date.now(); cloud.ts=ts;
    cloud.ref.set({blob:JSON.stringify(S),ts,origin:cloud.id,updatedAt:new Date().toISOString()})
      .then(()=>cloudDot('ok')).catch(e=>{console.warn('Cloud-Push',e);cloudDot('err');});
  },seed?0:250);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tvMode)exitTV();});

load();
cloudInit();

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
